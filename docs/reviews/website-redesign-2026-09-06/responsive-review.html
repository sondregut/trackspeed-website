<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrackSpeed responsive review</title>
<style>
  body { margin:0; background:#e4e8eb; color:#192126; font:14px system-ui,sans-serif; }
  nav { display:flex; align-items:center; flex-wrap:wrap; gap:12px; padding:12px 20px; background:white; border-bottom:1px solid #ccd2d6; }
  label { display:flex; gap:8px; align-items:center; }
  select { font:inherit; padding:8px; }
  iframe { display:block; width:390px; height:844px; margin:16px auto; background:white; border:1px solid #c7cdd1; }
</style>
<nav aria-label="Preview controls">
  <strong>Local responsive review</strong>
  <label>Width <select id="width"><option>360</option><option selected>390</option><option>768</option><option>1024</option></select></label>
  <label>Language <select id="locale"><option value="">English</option><option value="nb">Norwegian</option><option value="de">German</option><option value="ar">Arabic</option><option value="ja">Japanese</option><option value="hi">Hindi</option></select></label>
  <label>Page <select id="page"><option value="">Home</option><option value="features">Features</option><option value="technology">Technology</option><option value="pro">Pro</option><option value="about">About</option><option value="support">Support</option></select></label>
</nav>
<iframe id="preview" title="TrackSpeed responsive preview" src="snapshots/en/home.html"></iframe>
<script>
  const frame = document.getElementById('preview');
  document.getElementById('width').addEventListener('change', event => { frame.style.width = event.target.value + 'px'; });
  function navigate() {
    frame.src = 'snapshots/' + (document.getElementById('locale').value || 'en') + '/' + (document.getElementById('page').value || 'home') + '.html';
  }
  document.getElementById('locale').addEventListener('change', navigate);
  document.getElementById('page').addEventListener('change', navigate);
</script>
</html>
